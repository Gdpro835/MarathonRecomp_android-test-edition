# Build Android APK - GitHub Actions workflow (no secrets anywhere).
#
# Everything is automatic:
#   - game files come from a PUBLIC URL you control (Google Drive / HuggingFace);
#     the zip only needs default.xex, shader.arc, shader_lt.arc
#   - all git submodules (incl. nested) are initialized automatically
#   - ffmpeg for Android (with the XMA decoder) is built automatically from source
#   - bundled Turnip drivers are optional: drop drivers/*.so into the zip
#
# Set the URL either per-run (Actions -> Run workflow -> build_files_url) or once
# as the repository variable BUILD_FILES_URL.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_files_url:
        description: 'Public URL of the game-files zip (default.xex + shader.arc + shader_lt.arc)'
        required: false
        type: string
  push:
    branches: [arena/019fbd91-marathonrecomp]

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_FILES_URL: ${{ inputs.build_files_url || vars.BUILD_FILES_URL || '' }}
      NDK_VERSION: "29.0.14206865"
      VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout submodules (automatic)
        run: |
          for attempt in 1 2 3; do
            if git submodule update --init --depth 1 --recursive \
                tools/XenonRecomp tools/XenosRecomp \
                thirdparty/SDL thirdparty/SDL_mixer thirdparty/msdf-atlas-gen \
                thirdparty/stb thirdparty/concurrentqueue thirdparty/magic_enum \
                thirdparty/unordered_dense thirdparty/json thirdparty/ddspp \
                thirdparty/imgui thirdparty/implot thirdparty/vcpkg \
                MarathonRecompResources; then
              echo "Submodules initialized on attempt $attempt"
              break
            fi
            echo "Submodule fetch failed (attempt $attempt/3), retrying..."
            sleep 10
          done
          git submodule status | sed 's/^/  /'

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build unzip patch lld
          cmake --version
          ninja --version
          clang --version | head -1
          ld.lld --version | head -1

      - name: Set up Android SDK / NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

          sdkmanager_bin="$(ls "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "::error::Android SDK cmdline-tools not found under $sdk_root" >&2
            exit 1
          fi

          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch game files
        if: env.BUILD_FILES_URL != ''
        run: |
          bash tools/ci/fetch_build_files.sh "$BUILD_FILES_URL" "$GITHUB_WORKSPACE/ci-build-files"
          mkdir -p MarathonRecompLib/private
          cp ci-build-files/game/default.xex MarathonRecompLib/private/default.xex
          cp ci-build-files/game/shader.arc MarathonRecompLib/private/shader.arc
          cp ci-build-files/game/shader_lt.arc MarathonRecompLib/private/shader_lt.arc
          if ls ci-build-files/drivers/*.so >/dev/null 2>&1; then
            cp ci-build-files/drivers/*.so android-apk/app/src/main/assets/bundled_driver/
          fi

      - name: Fail early if game files are missing
        run: |
          test -f MarathonRecompLib/private/default.xex || { \
            echo "::error::Game files are missing. Set the BUILD_FILES_URL repository variable or pass build_files_url to this workflow."; \
            exit 1; }

      # Host tools MUST be built with Clang/lld (the project's toolchains are
      # clang-based; mixing GNU ld with clang-built archives causes
      # "file format not recognized"). Compilers are passed to CMake explicitly,
      # never via environment exports, so every archive is built by the same
      # compiler and linked by the same linker.
      - name: Build host tools
        run: |
          cmake -S . -B out/build/linux-host-tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_AR=llvm-ar \
            -DCMAKE_NM=llvm-nm \
            -DCMAKE_RANLIB=llvm-ranlib \
            -DCMAKE_LINKER=ld.lld \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DMARATHON_RECOMP_HOST_TOOLS_ONLY=ON
          cmake --build out/build/linux-host-tools --target XenonRecomp XenosRecomp file_to_c u8extract -j2
          ls -la out/build/linux-host-tools/tools/XenonRecomp/XenonRecomp/XenonRecomp

      - name: Build ffmpeg for Android (automatic)
        run: |
          bash tools/ci/build_ffmpeg_android.sh \
            "$ANDROID_NDK_HOME" \
            "$GITHUB_WORKSPACE/ci-ffmpeg/android-arm64"
          echo "FFMPEG_CORE_LOCAL_LIB_DIR=$GITHUB_WORKSPACE/ci-ffmpeg/android-arm64/lib" >> "$GITHUB_ENV"

      - name: Configure Android build
        run: |
          cmake -S . -B out/build/android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DMARATHON_RECOMP_ANDROID=ON \
            -DMARATHON_RECOMP_HOST_XENON_RECOMP="$GITHUB_WORKSPACE/out/build/linux-host-tools/tools/XenonRecomp/XenonRecomp" \
            -DMARATHON_RECOMP_HOST_XENOS_RECOMP="$GITHUB_WORKSPACE/out/build/linux-host-tools/tools/XenosRecomp/XenosRecomp" \
            -DMARATHON_RECOMP_HOST_FILE_TO_C="$GITHUB_WORKSPACE/out/build/linux-host-tools/tools/file_to_c/file_to_c" \
            -DMARATHON_RECOMP_HOST_U8EXTRACT="$GITHUB_WORKSPACE/out/build/linux-host-tools/tools/u8extract/u8extract" \
            -DFFMPEG_CORE_LOCAL_LIB_DIR="$FFMPEG_CORE_LOCAL_LIB_DIR"

      - name: Build libmain.so
        run: |
          cmake --build out/build/android-arm64 --target MarathonRecomp -j4
          test -f out/build/android-arm64/MarathonRecomp/libmain.so

      - name: Copy libmain.so into the APK project
        run: |
          cp out/build/android-arm64/MarathonRecomp/libmain.so android-apk/app/src/main/jniLibs/arm64-v8a/libmain.so

      - name: Assemble debug APK
        working-directory: android-apk
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-android-arm64
          path: android-apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
