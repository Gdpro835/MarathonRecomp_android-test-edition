def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34
    ndkVersion "29.0.14206865"
    defaultConfig {
        // Java sources and JNI bindings stay in the org.libsdl.app namespace (SDL
        // registers natives against those class names); only the install identity
        // changes. Renaming this orphans data under Android/data/<old id>.
        applicationId "com.sega.marathon"
        minSdkVersion 29
        targetSdkVersion 34
        // versionCode MUST increase on every build, otherwise Android refuses to
        // install a new APK over an already-installed one (the installer silently
        // dismisses the dialog) and testers have to uninstall first, losing their
        // saves/game files. The CI workflow exports APP_VERSION_STAMP = minutes
        // since the Unix epoch before invoking Gradle, so the build stamp, the
        // versionName and the GitHub release tag all match exactly; a local build
        // falls back to computing the same stamp itself. Minutes-since-epoch fits
        // well inside a 32-bit int and is strictly monotonic, so any later build
        // installs over any earlier one.
        def versionStamp = System.getenv("APP_VERSION_STAMP")
        def versionCodeValue = (versionStamp != null && versionStamp.isInteger())
            ? versionStamp.toInteger()
            : ((System.currentTimeMillis() / 60000L) as int)
        versionCode = versionCodeValue
        // Human-readable mirror of the same stamp, so the launcher's version
        // display and the in-app update check both work.
        versionName = "1.0.0.${versionCodeValue}"
    }
    // CI provides the release keystore through environment variables (see
    // .github/workflows/android.yml); local release builds stay unsigned.
    if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
        signingConfigs {
            ci {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.ci
            }
        }
    }
    // MarathonRecomp's libmain.so is built separately by the project's own CMake pipeline
    // (see the android-release preset and build scripts) and copied into
    // src/main/jniLibs/arm64-v8a/ manually; there is intentionally no Gradle ndk-build step.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
